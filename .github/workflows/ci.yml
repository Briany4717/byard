name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only the ones targeting `main`.
  #
  # A stacked PR, one whose base is the branch below it, got no checks at
  # all under a `branches: [main]` filter, so a whole series could be reviewed
  # and merged without clippy or the test suite ever running on it. That is the
  # same shape as the defect this phase is about: a gate that silently does not
  # apply is worse than no gate, because everyone believes it applied.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # A CI build is thrown away after one run, so incremental state is pure
  # overhead, and full debug info mostly buys link time. Line tables keep
  # file and line in a failing test's backtrace.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on the toolchain and the lockfile, saved again after every run
      # rather than only on the first one for a given lockfile, and cleaned of
      # the workspace's own artifacts, which are rebuilt anyway. The plain
      # cache it replaces never updated once saved, so every run compiled the
      # whole workspace from a stale starting point.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Clippy and the tests build different artifacts; cache both.
          cache-all-crates: true

      - name: Install Linux GPU dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dev

      - name: fmt
        run: cargo fmt --all -- --check

      # `--locked` on every cargo invocation that resolves. The lockfile is
      # committed, so a build that needs to change it is a build whose inputs
      # nobody chose — CI must refuse it rather than quietly resolve something
      # newer than what was reviewed.
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: test
        run: cargo test --locked --workspace

      # The accessibility bridge is opt-in (RFC-0042 Q4), so the steps above
      # never compile it. A gate that silently does not apply is worse than
      # none: build, lint and test it on purpose.
      - name: clippy (a11y)
        run: cargo clippy --locked -p byard-platform -p byard -p byard-cli --all-targets --features byard-platform/a11y,byard/a11y,byard-cli/a11y

      - name: test (a11y)
        run: cargo test --locked -p byard-platform --features a11y

      # The resource budgets in ci/budgets.toml (RFC-0046) that are tests, run
      # again with their output shown, which a passing test does not give:
      # each prints what it measured next to its ceiling, so the margin is in
      # this log before it is gone. They already ran, and passed or failed,
      # in `test` above; this adds the numbers and takes a few seconds. The
      # first-frame time is only held on Linux, where its ceiling was measured.
      - name: budgets (measured against their ceilings)
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p aura-weather --test it budgets -- --nocapture
          cargo test --locked -p aura-weather --test first_frame -- --nocapture
