name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only the ones targeting `main`.
  #
  # A stacked PR, one whose base is the branch below it, got no checks at
  # all under a `branches: [main]` filter, so a whole series could be reviewed
  # and merged without clippy or the test suite ever running on it. That is the
  # same shape as the defect this phase is about: a gate that silently does not
  # apply is worse than no gate, because everyone believes it applied.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux GPU dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dev

      - name: fmt
        run: cargo fmt --all -- --check

      # `--locked` on every cargo invocation that resolves. The lockfile is
      # committed, so a build that needs to change it is a build whose inputs
      # nobody chose — CI must refuse it rather than quietly resolve something
      # newer than what was reviewed.
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: test
        run: cargo test --locked --workspace
