[workspace]
resolver = "2"
# Crates will be added here as phases land.
# Planned layout:
#   crates/byard-core, engine subsystems (render, spatial, logic, concurrency)
#   crates/byard-compiler, byld lexer, parser, and AST interpreter
#   crates/byard-macro, #[byard_controller] procedural macro
#   crates/byard-platform, PlatformHost implementations (winit, etc.)
#   crates/byard, public façade re-exporting the above
members = [
    "crates/byard",
    "crates/byard-compiler",
    "crates/byard-core",
    "crates/byard-platform",
    "crates/byard-macro",
    "crates/byld-lsp",
    "crates/byard-cli",
    # Test support: one GPU device per test process, used by one test at a time.
    "crates/byard-test-gpu",
    "crates/byard-project",
    # Runnable two-layer apps: a `.byd` view plus the Rust controller half
    # (RFC-0028 §2). They are workspace members so `cargo test --workspace`
    # compiles them, which is what keeps the façade's public surface honest.
    "examples/controller_demo",
    "examples/sparkline_view",
    "examples/aura_weather",
]

[workspace.package]
version     = "0.0.0"
edition     = "2024"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/Briany4717/byard"
homepage    = "https://github.com/Briany4717/byard"
authors     = ["Byard contributors"]
rust-version = "1.86"

[workspace.lints.rust]
unsafe_code     = "deny"
missing_docs    = "warn"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow these pedantic lints that are too noisy for a young codebase:
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
# New in clippy 1.99: wants `assert_eq!(xs, [] as [T; 0])` for
# `assert!(xs.is_empty())`. The tests here pair an emptiness check with a
# message saying what the emptiness means, which the rewrite loses, and the
# typed empty array reads worse than the method it replaces.
assert_is_empty         = "allow"

# A one-line fix to swash 0.2.9's variation coordinates, which leaked from
# one font to the next. See third_party/swash/BYARD.md.
[patch.crates-io]
swash = { path = "third_party/swash" }
