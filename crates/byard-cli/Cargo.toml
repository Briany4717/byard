[package]
name = "byard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "byard"
path = "src/main.rs"

[dependencies]
byard-compiler = { path = "../byard-compiler" }
byard-platform = { path = "../byard-platform" }
byard-core     = { path = "../byard-core" }
byard-project  = { path = "../byard-project" }
clap           = { version = "4", features = ["derive"] }
toml           = { workspace = true, features = ["preserve_order"] }
semver.workspace = true
toml_edit      = "0.25"
sha2.workspace = true
pollster.workspace = true
wgpu.workspace = true
crossbeam-channel.workspace = true
# `byard shot` writes PNGs. Already in the tree through the image stack.
image = { workspace = true, features = ["png"] }
# RFC-0008 D-H: package archives are gzip-compressed. Already in the tree
# (through the image stack), so this adds no new crate.
flate2.workspace = true


[lints]
workspace = true
