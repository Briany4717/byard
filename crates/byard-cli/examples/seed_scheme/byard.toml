[project]
name = "seed_scheme"
entry = "src/main.byd"

# RFC-0022 §5: one brand colour, and the engine derives every colour role of
# both schemes from it. Change the seed and run again: the whole app moves to
# the new hue, and every text colour stays readable on what it sits on.
[theme]
name = "seeded"
seed = "#1E8E3E"
transition = 300

# An explicit token still wins over the derived one. Uncomment to see the
# light-scheme primary pinned while everything else follows the seed.
# [theme.color.light]
# primary = "#0B57D0"

# RFC-0053: named motion. The view moves its squares with `t.springSpatialFast`
# and `t.springSpatialSlow`, which `byard-base` ships. Declaring one here
# replaces it for the whole app; uncomment to make the fast spring settle
# without ringing (a damping ratio of 1.0 does not overshoot).
# [theme.motion]
# spatial_fast = { stiffness = 800, damping_ratio = 1.0 }
