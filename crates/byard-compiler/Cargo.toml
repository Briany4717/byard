[package]
name = "byard-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
logos = "0.14"
smallvec = "1"
crossbeam-channel = "0.5"
notify = "6"
byard-core = { path = "../byard-core" }
bymsdfgen-core = "0.1"
usvg = { version = "0.45", default-features = false }

[features]
default = ["telemetry"]
# Forwards `byard-core`'s zero-allocation profiler (RFC-0013) so
# `--no-default-features` turns the interpreter's own scopes (RFC-0030 §I1)
# off in the same build it turns the engine's off. The scopes themselves are
# `byard_core::profile_scope!`, which resolves the feature at its definition
# site — this entry exists so the two crates can never disagree about whether
# telemetry is on.
telemetry = ["byard-core/telemetry"]

[dev-dependencies]
proptest = "1"
byard-core = { path = "../byard-core" }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
