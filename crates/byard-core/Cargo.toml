[package]
name = "byard-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
bumpalo = "3"
taffy = "0.10"
rustc-hash = "2"
smallvec = "1"
wgpu = "29.0"
bytemuck = { version = "1.14", features = ["derive"] }
glyphon = "0.11"
# Relay subsystem (RFC-0001 §5): lock-free Arc<RenderFrame> publish/subscribe,
# zero-allocation-steady-state frame recycling, and the async I/O pool.
arc-swap = "1"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
# Image decode for the `TextureSampler` pipeline (M21, IMPL-32). PNG/JPEG only
# keeps the dependency tree small; the runner/host owns decode, not the interp.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# RFC-0029 O3: JSON parse/stringify for the `Json` capability and for `Http`'s
# `.json` field. `preserve_order` keeps object key order, so a record that
# round-trips through JSON comes back in the order it was written, matching
# RFC-0027's ordered records.
serde_json = { version = "1", features = ["preserve_order"], optional = true }
# RFC-0029 O2: the `Http` capability. rustls + webpki-roots, never native TLS:
# pure Rust (so `unsafe_code = "deny"` holds all the way down), no OpenSSL, no
# platform certificate store, and an identical build on every OS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "charset", "http2"], optional = true }

[dev-dependencies]
# Blocks on the async wgpu device request inside headless pipeline tests (M21).
pollster = "0.4"
# Headless WGSL validation of every shader module (RFC-0009 M44): naga 29 matches
# wgpu 29's bundled shader compiler, so a green naga validation predicts a clean
# `create_shader_module` on the GPU without needing a device.
naga = { version = "29.0", features = ["wgsl-in"] }

[features]
default = ["telemetry", "runtime-io", "json", "net"]
# Zero-allocation profiler (RFC-0013): `profile_scope!` compiles to nothing
# when this is off, so a release build pays exactly zero cost for it.
telemetry = []
# RFC-0029 O1: Tokio's `net` and `time` drivers, and the `.enable_all()` that
# starts them. Every capability RFC-0029 adds needs them (a socket or a
# `tokio::time::sleep` panics without a reactor), so this is default-on; a
# headless or embedded build drops it and gets the original compute-only
# runtime back with no networking or timer code compiled in.
runtime-io = ["tokio/net", "tokio/time", "tokio/macros"]
# RFC-0029 O3: `Json`, and the `.json` field on an `Http` response.
json = ["dep:serde_json"]
# RFC-0029 O2: the first-party `Http` capability. Requires `runtime-io` (a
# socket needs the reactor) and `json` (a response's `.json` field is the
# reason most callers want it at all).
net = ["dep:reqwest", "runtime-io", "json"]

[lints]
workspace = true

[[bench]]
name = "evaluator"
harness = false

[[bench]]
name = "atlas"
harness = false

[[bench]]
name = "spatial"
harness = false
