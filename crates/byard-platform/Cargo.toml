[package]
name = "byard-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true


[lib]
# No runnable doc examples here: skip the rustdoc pass that `cargo test`
# would otherwise spend on this crate. Turn it back on with the first one.
doctest = false

[dependencies]
# RFC-0041 §3: the system clipboard behind a text field's copy, cut and paste.
# `wayland-data-control` is what makes it work under Hyprland, GNOME and KDE on
# Wayland as well as X11; without it a Wayland session reads as empty. Default
# features are off, they only add image support, which a text field never uses.
# Linked into the windowed host and nowhere else: never `byard-core`, never the
# compiler.
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
byard-core = { path = "../byard-core" }
wgpu = "29.0"
# winit is a regular (non-dev) dependency of this crate by design: it is the
# entire reason byard-platform exists (RFC-0001 §6). It never appears in
# WinitHost's public API surface (PlatformHost::run takes/returns no winit
# types), so downstream crates can depend on byard-platform without ever
# importing winit themselves.
winit = "0.30"
# RFC-0042: the accessibility tree, mapped onto AccessKit and handed to the
# platform's screen-reader API (AT-SPI on Linux, UI Automation on Windows,
# NSAccessibility on macOS). Opt-in, behind the `a11y` feature: an app that
# does not ask for it carries none of AccessKit's crates or code (RFC-0042 Q4).
accesskit = { version = "0.25", optional = true }
accesskit_winit = { version = "0.34", optional = true }

[features]
# Pulls in AccessKit and hands the tree to the platform's screen reader. Off
# by default: it adds about a fifth to a stripped release binary, which an app
# opts into (RFC-0042 Q4).
a11y = ["dep:accesskit", "dep:accesskit_winit"]

[dev-dependencies]
# The one device every GPU test in a process shares, one test at a time.
byard-test-gpu = { path = "../byard-test-gpu" }
# Visual verification example (examples/hello_world.rs).
# Minimal async executor for blocking on `Engine::init` inside `on_resume`.
pollster = "0.3"
# hello_world_byd example: drives the byld interpreter in a real winit window.
byard-compiler = { path = "../byard-compiler" }
# Dumps readback frames to PNG for visual verification (gated behind
# BYARD_DUMP_PNG); dev-only, never in the shipped engine.
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
