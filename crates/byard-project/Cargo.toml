[package]
name = "byard-project"
description = "A Byard project on disk: its manifest, theme, dependencies, lockfile and package archives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true


[lib]
# No runnable doc examples here: skip the rustdoc pass that `cargo test`
# would otherwise spend on this crate. Turn it back on with the first one.
doctest = false

[dependencies]
byard-compiler = { path = "../byard-compiler" }
byard-core     = { path = "../byard-core" }
toml           = { version = "0.8", features = ["preserve_order"] }
image          = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2           = "0.10"
flate2         = "1"
# RFC-0008 D-K: version requirements and the solver that picks versions for
# them. PubGrub because its failure explanation is one a user can act on.
pubgrub = "0.3.0"
semver = "1.0.28"
# A registry served over HTTP. Already in the tree through the runtime's
# `net` feature; `blocking` because `byard get` is a command, not a loop.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }

[lints]
workspace = true
