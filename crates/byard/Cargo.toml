[package]
name = "byard"
version.workspace = true
description = "A GPU UI framework: the interface in byld, the logic in Rust, and the `byard` command"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

# `cargo install byard` installs the `byard` command. The library is what an
# app links; the binary is the CLI, which lives in `byard-cli` and is only
# compiled with the `cli` feature.
[[bin]]
name = "byard"
path = "src/bin/byard.rs"
required-features = ["cli"]
doc = false

[dependencies]
byard-core.workspace = true
byard-macro.workspace = true
# `App` is the shipped-application runner (RFC-0028 §2): it lowers the `.byd`
# entry with the interpreter and drives it through the winit host. The façade
# is the top of the dependency graph, so both edges point forward (`byard-core`
# never depends on the compiler).
byard-compiler.workspace = true
byard-platform.workspace = true
# `App` reads a project the way `byard dev` does: manifest, theme, fonts,
# sibling views and packages (RFC-0008, RFC-0022).
byard-project.workspace = true
wgpu.workspace = true
pollster.workspace = true
# `App::hot_reload` hands the watcher a channel of its own.
crossbeam-channel.workspace = true
# `App::shot` writes a PNG.
image = { workspace = true, features = ["png"] }
# The `byard` command (`cli` feature). Never linked into an app: only the
# binary above uses it.
byard-cli = { workspace = true, optional = true }

[features]
# On by default so that `cargo install byard` gives the `byard` command. An app
# that depends on `byard` does not link it either way; `default-features =
# false` only saves compiling it.
default = ["cli"]
cli = ["dep:byard-cli"]
# RFC-0042 Q4: hands the accessibility tree to the platform's screen reader
# through AccessKit. Opt-in: `byard = { ..., features = ["a11y"] }`.
a11y = ["byard-platform/a11y", "byard-cli?/a11y"]

[lints]
workspace = true
