[package]
name = "byard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
byard-core = { path = "../byard-core" }
byard-macro = { path = "../byard-macro" }
# `App` is the shipped-application runner (RFC-0028 §2): it lowers the `.byd`
# entry with the interpreter and drives it through the winit host. The façade
# is the top of the dependency graph, so both edges point forward (`byard-core`
# never depends on the compiler).
byard-compiler = { path = "../byard-compiler" }
byard-platform = { path = "../byard-platform" }
# `App` reads a project the way `byard dev` does: manifest, theme, fonts,
# sibling views and packages (RFC-0008, RFC-0022).
byard-project = { path = "../byard-project" }
wgpu.workspace = true
pollster.workspace = true
# `App::hot_reload` hands the watcher a channel of its own.
crossbeam-channel.workspace = true
# `App::shot` writes a PNG.
image = { workspace = true, features = ["png"] }

[features]
# RFC-0042 Q4: hands the accessibility tree to the platform's screen reader
# through AccessKit. Opt-in: `byard = { ..., features = ["a11y"] }`.
a11y = ["byard-platform/a11y"]

[lints]
workspace = true
