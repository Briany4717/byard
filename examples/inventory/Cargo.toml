[package]
name = "stockroom"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
byard = { path = "../../crates/byard" }
# Where the app's data directory is, for the CSV export (see src/controller.rs).
directories = "6"

[lints]
workspace = true

# The tests read the app as its runtime does (the project, then the program)
# and drive it through the interpreter, with no window.
[dev-dependencies]
byard-project  = { path = "../../crates/byard-project" }
byard-compiler = { path = "../../crates/byard-compiler" }
byard-core     = { path = "../../crates/byard-core" }
# The budget test reads its ceilings from ci/budgets.toml.
toml           = { workspace = true }
